name: Android

on:
  push:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.38.4"

defaults:
  run:
    working-directory: app
    # Naming bash adds pipefail, so `flutter build ... | tee build.log` fails
    # the step when the build fails instead of taking tee's exit code.
    shell: bash

jobs:
  checks:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # Analyzer errors and failing tests also show up as annotations on the
      # run summary, so they can be read without opening the logs.
      - name: Analyze (fails on errors only)
        run: |
          set +e
          dart analyze --format=machine --no-fatal-warnings > analyze.txt 2>&1
          status=$?
          set -e
          { grep '^ERROR|' analyze.txt || true; } | head -50 |
            while IFS='|' read -r severity type code file line column length message; do
              echo "::error file=${file#"$GITHUB_WORKSPACE/"},line=$line,col=$column::$message ($code)"
            done
          echo "errors: $(grep -c '^ERROR|' analyze.txt || true)," \
            "warnings: $(grep -c '^WARNING|' analyze.txt || true)," \
            "infos: $(grep -c '^INFO|' analyze.txt || true)"
          if [ "$status" -ne 0 ] && ! grep -q '^ERROR|' analyze.txt; then
            cat analyze.txt
          fi
          exit $status

      # One test file at a time: several repository tests share the same
      # sqflite test database and delete it in setUp, so parallel files
      # wipe each other's data.
      - name: Test
        run: >-
          flutter test --concurrency=1 --reporter=github
          --file-reporter=json:test-results.json

      - name: Report test failures
        if: failure()
        run: |
          [ -f test-results.json ] || exit 0
          python3 - <<'PY'
          import json, os

          root = os.environ["GITHUB_WORKSPACE"] + "/"
          suites, tests, errors, failed = {}, {}, {}, []
          for line in open("test-results.json"):
              try:
                  event = json.loads(line)
              except ValueError:
                  continue
              kind = event.get("type")
              if kind == "suite":
                  suites[event["suite"]["id"]] = event["suite"].get("path") or ""
              elif kind == "testStart":
                  tests[event["test"]["id"]] = event["test"]
              elif kind == "error":
                  errors.setdefault(event["testID"], []).append(event["error"])
              elif kind == "testDone" and event.get("result") != "success":
                  failed.append(event["testID"])

          by_file = {}
          for test_id in failed:
              test = tests.get(test_id, {})
              path = suites.get(test.get("suiteID"), "")
              message = "\n".join(errors.get(test_id, ["(no error message)"]))
              lines = message.strip().splitlines()[:12]
              by_file.setdefault(path, []).append(
                  "- " + test.get("name", "?") + "\n    " + "\n    ".join(lines)
              )

          def escape(text):
              return text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")

          # GitHub keeps at most 10 error annotations per step.
          for path, entries in list(by_file.items())[:9]:
              body = "\n".join(entries)[:6000]
              rel = path[len(root):] if path.startswith(root) else path
              print(f"::error file={rel},title={len(entries)} failed::{escape(body)}")
          if len(by_file) > 9:
              rest = ", ".join(p.rsplit("/", 1)[-1] for p in list(by_file)[9:])
              print(f"::error title=More failing files::{escape(rest)}")
          PY

  build:
    name: Build APK
    runs-on: ubuntu-latest
    env:
      GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
      MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # The Google Services Gradle plugin refuses to build without this file.
      # Without the secret, a placeholder lets the app build; shared-expense
      # push notifications won't work in that build.
      - name: Add google-services.json
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          else
            echo "::warning::GOOGLE_SERVICES_JSON_BASE64 not set; using a placeholder Firebase config."
            cat > android/app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "totals-ci-placeholder",
              "storage_bucket": "totals-ci-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000001",
                  "android_client_info": { "package_name": "detached.totals" }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "placeholder" }],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000002",
                  "android_client_info": { "package_name": "detached.totals.test" }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "placeholder" }],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000003",
                  "android_client_info": { "package_name": "detached.totals.personal" }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "placeholder" }],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          JSON
          fi

      # flutter pub get creates android/local.properties; the map key is read
      # from there. Without it the Spending Map shows a blank map.
      - name: Add Maps API key
        if: env.MAPS_API_KEY != ''
        run: echo "MAPS_API_KEY=$MAPS_API_KEY" >> android/local.properties

      # A PKCS12 keystore made with openssl uses one password for the store
      # and the key, and the alias "upload" unless you chose another.
      - name: Add release signing key
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}
          keyAlias=${KEY_ALIAS:-upload}
          storeFile=upload-keystore.jks
          EOF

      # The personal flavor ("Totals", detached.totals.personal) is the build to
      # use day to day: release mode, signed with your key, installed next to
      # the Play Store app. Keep the same key so later builds update it.
      - name: Build signed release
        if: env.KEYSTORE_BASE64 != ''
        run: flutter build apk --release --flavor personal 2>&1 | tee build.log

      # Debug builds use the qa flavor (detached.totals.test, "totals-test"),
      # which installs next to the Play Store app instead of replacing it.
      - name: Build debug APK
        if: env.KEYSTORE_BASE64 == ''
        run: flutter build apk --debug --flavor qa 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        run: |
          [ -f build.log ] || exit 0
          excerpt=$(grep -E -A4 'error:|Error:|ERROR:|FAILURE:|What went wrong' build.log | head -60 || true)
          [ -n "$excerpt" ] || excerpt=$(tail -40 build.log)
          excerpt=${excerpt//'%'/'%25'}
          excerpt=${excerpt//$'\r'/'%0D'}
          excerpt=${excerpt//$'\n'/'%0A'}
          echo "::error title=Build failed::$excerpt"

      # Artifacts in a public repo are downloadable by anyone signed in to
      # GitHub, so don't keep builds around longer than needed to grab them.
      - uses: actions/upload-artifact@v4
        with:
          name: totals-android
          retention-days: 3
          path: |
            app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
